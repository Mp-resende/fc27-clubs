[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "fc27-clubs"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fc-clubs-api",
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic",
    "jinja2",
    "pydantic-settings",
    "structlog",
    "python-multipart",
    "httpx",
]

[project.optional-dependencies]
ocr = [
    "Pillow",
    "pytesseract",
]
dev = [
    "httpx",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
